<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問題集 進捗管理</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #ddd8ca;
    --text: #2c2c2a;
    --text-sub: #6b6a63;
    --accent: #0f6e56;
    --accent-light: #e1f5ee;
    --danger: #a32d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 4px 0 16px;
  }
  .subject-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .subject-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .subject-name {
    font-size: 16px;
    font-weight: 600;
  }
  .subject-meta {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 10px;
  }
  .round-block {
    margin-bottom: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .round-block:first-of-type { border-top: none; padding-top: 0; }
  .round-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .round-label {
    font-weight: 600;
    font-size: 14px;
  }
  .round-progress {
    font-size: 12px;
    color: var(--text-sub);
  }
  .progress-bar {
    height: 5px;
    background: #eceae0;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s ease;
  }
  .num-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .num-cell {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 12px;
    background: var(--card);
    color: var(--text-sub);
    cursor: pointer;
    user-select: none;
  }
  .num-cell.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .small-btn {
    font-size: 12px;
    color: var(--text-sub);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .small-btn.danger { color: var(--danger); border-color: var(--danger); }
  .round-actions {
    display: flex;
    gap: 6px;
  }
  .add-round-btn {
    margin-top: 8px;
    width: 100%;
    padding: 8px;
    font-size: 13px;
    background: var(--accent-light);
    color: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .subject-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .add-subject-card {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .add-subject-card input {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
  }
  .add-subject-btn {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .empty-msg {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    padding: 24px 0;
  }
  .status-note {
    font-size: 11px;
    color: var(--text-sub);
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>問題集 進捗管理</h1>
<div id="subjects"></div>
<div class="add-subject-card">
  <input type="text" id="new-subject-name" placeholder="問題集の名前(例:簿記2級 商業簿記)">
  <input type="number" id="new-subject-total" placeholder="全問題数(例:31)" min="1">
  <button class="add-subject-btn" onclick="addSubject()">問題集を追加</button>
</div>
<div class="status-note" id="status-note"></div>

<script>
const STORAGE_KEY = "progress-tracker-state";
let state = { subjects: [] };

function circledNumber(n) {
  const circled = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
  return circled[n - 1] || (n + "周目");
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
    } else {
      seedDefault();
    }
  } catch (e) {
    seedDefault();
  }
  render();
}

function seedDefault() {
  state = {
    subjects: [
      {
        id: "s1",
        name: "問題集1",
        total: 31,
        rounds: [
          { id: "r1", n: 1, done: Array.from({length: 20}, (_, i) => i + 1) },
          { id: "r2", n: 2, done: Array.from({length: 31}, (_, i) => i + 1) },
          { id: "r3", n: 3, done: [8,9,10,11,12] }
        ]
      }
    ]
  };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    document.getElementById("status-note").textContent = "";
  } catch (e) {
    document.getElementById("status-note").textContent = "保存に失敗しました";
  }
}

function addSubject() {
  const nameInput = document.getElementById("new-subject-name");
  const totalInput = document.getElementById("new-subject-total");
  const name = nameInput.value.trim();
  const total = parseInt(totalInput.value, 10);
  if (!name) {
    nameInput.style.borderColor = "var(--danger)";
    return;
  }
  if (!total || total < 1) {
    totalInput.style.borderColor = "var(--danger)";
    return;
  }
  const id = "s" + Date.now();
  state.subjects.push({
    id,
    name,
    total,
    rounds: [{ id: "r" + Date.now(), n: 1, done: [] }]
  });
  nameInput.value = "";
  totalInput.value = "";
  nameInput.style.borderColor = "";
  totalInput.style.borderColor = "";
  saveState();
  render();
}

function deleteSubject(subjectId) {
  state.subjects = state.subjects.filter(s => s.id !== subjectId);
  saveState();
  render();
}

function addRound(subjectId) {
  const subject = state.subjects.find(s => s.id === subjectId);
  const nextN = subject.rounds.length ? Math.max(...subject.rounds.map(r => r.n)) + 1 : 1;
  subject.rounds.push({ id: "r" + Date.now(), n: nextN, done: [] });
  saveState();
  render();
}

function deleteRound(subjectId, roundId) {
  const subject = state.subjects.find(s => s.id === subjectId);
  subject.rounds = subject.rounds.filter(r => r.id !== roundId);
  saveState();
  render();
}

function toggleNum(subjectId, roundId, num) {
  const subject = state.subjects.find(s => s.id === subjectId);
  const round = subject.rounds.find(r => r.id === roundId);
  const idx = round.done.indexOf(num);
  if (idx >= 0) {
    round.done.splice(idx, 1);
  } else {
    round.done.push(num);
  }
  saveState();
  render();
}

function render() {
  const container = document.getElementById("subjects");
  container.innerHTML = "";

  if (state.subjects.length === 0) {
    container.innerHTML = '<div class="empty-msg">まだ問題集がありません。下から追加してください。</div>';
    return;
  }

  state.subjects.forEach(subject => {
    const card = document.createElement("div");
    card.className = "subject-card";

    const header = document.createElement("div");
    header.className = "subject-header";
    header.innerHTML = `<span class="subject-name">${escapeHtml(subject.name)}</span>`;
    const delBtn = document.createElement("button");
    delBtn.className = "small-btn danger";
    delBtn.textContent = "削除";
    delBtn.dataset.armed = "0";
    delBtn.onclick = () => {
      if (delBtn.dataset.armed === "1") {
        deleteSubject(subject.id);
      } else {
        delBtn.dataset.armed = "1";
        delBtn.textContent = "本当に削除";
        setTimeout(() => { delBtn.dataset.armed = "0"; delBtn.textContent = "削除"; }, 3000);
      }
    };
    header.appendChild(delBtn);
    card.appendChild(header);

    const meta = document.createElement("div");
    meta.className = "subject-meta";
    meta.textContent = "全" + subject.total + "問";
    card.appendChild(meta);

    const sortedRounds = [...subject.rounds].sort((a, b) => b.n - a.n);
    sortedRounds.forEach(round => {
      const block = document.createElement("div");
      block.className = "round-block";

      const rHeader = document.createElement("div");
      rHeader.className = "round-header";
      const pct = subject.total ? Math.round((round.done.length / subject.total) * 100) : 0;
      rHeader.innerHTML = `
        <span class="round-label">${circledNumber(round.n)}周目</span>
        <span class="round-progress">${round.done.length}/${subject.total} (${pct}%)</span>
      `;
      block.appendChild(rHeader);

      const pbar = document.createElement("div");
      pbar.className = "progress-bar";
      pbar.innerHTML = `<div class="progress-fill" style="width:${pct}%"></div>`;
      block.appendChild(pbar);

      const grid = document.createElement("div");
      grid.className = "num-grid";
      for (let n = 1; n <= subject.total; n++) {
        const cell = document.createElement("div");
        cell.className = "num-cell" + (round.done.includes(n) ? " done" : "");
        cell.textContent = n;
        cell.onclick = () => toggleNum(subject.id, round.id, n);
        grid.appendChild(cell);
      }
      block.appendChild(grid);

      const rActions = document.createElement("div");
      rActions.style.marginTop = "8px";
      rActions.style.textAlign = "right";
      const rDelBtn = document.createElement("button");
      rDelBtn.className = "small-btn danger";
      rDelBtn.textContent = "この周を削除";
      rDelBtn.dataset.armed = "0";
      rDelBtn.onclick = () => {
        if (rDelBtn.dataset.armed === "1") {
          deleteRound(subject.id, round.id);
        } else {
          rDelBtn.dataset.armed = "1";
          rDelBtn.textContent = "本当に削除";
          setTimeout(() => { rDelBtn.dataset.armed = "0"; rDelBtn.textContent = "この周を削除"; }, 3000);
        }
      };
      rActions.appendChild(rDelBtn);
      block.appendChild(rActions);

      card.appendChild(block);
    });

    const addRoundBtn = document.createElement("button");
    addRoundBtn.className = "add-round-btn";
    addRoundBtn.textContent = "+ 次の周を追加";
    addRoundBtn.onclick = () => addRound(subject.id);
    card.appendChild(addRoundBtn);

    container.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadState();
</script>

</body>
</html>
